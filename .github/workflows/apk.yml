# Builds the Android app from docs/app and attaches it to a GitHub release,
# so https://github.com/<owner>/<repo>/releases/latest/download/lpu-free-room.apk
# always points at the newest build. Publishing timetable data does not
# trigger this; only changes to the app itself do.
name: Build Android app

on:
  push:
    branches: [main]
    paths: ["docs/app/**", "app/**", ".github/workflows/apk.yml", ".github/patch_android.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Copy the app and point it at this repository's data
        working-directory: app
        run: |
          rm -rf www && mkdir www && cp -r ../docs/app/. www/
          OWNER=$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ "$(echo "$REPO" | tr '[:upper:]' '[:lower:]')" = "$OWNER.github.io" ]; then
            BASE="https://$OWNER.github.io/data/"
          else
            BASE="https://$OWNER.github.io/$REPO/data/"
          fi
          echo "window.FR_CONFIG = { dataBase: \"$BASE\" };" > www/config.js
          cat www/config.js

      - name: Create the Android project
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          python3 ../.github/patch_android.py android
          npx cap sync android

      - name: Build the APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the file
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk lpu-free-room.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: LPU Free Room ${{ github.run_number }}
          body: Android app built from ${{ github.sha }}. Install lpu-free-room.apk on the phone.
          files: lpu-free-room.apk
          make_latest: true
